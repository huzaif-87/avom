services:
  - type: web
    name: talentrank-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: TalentRank AI
      - key: VERSION
        value: 1.0.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: API_PREFIX
        value: /api
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: talentrank_ai
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: RESUME_STORAGE_DIR
        value: /tmp/resumes
